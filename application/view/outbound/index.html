<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鍑哄簱绠＄悊 - 浠撳偍绠＄悊绯荤粺</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>鍑哄簱绠＄悊</h1>
        <div class="mt-3 mb-3">
            <a href="/outbound/add" class="btn btn-primary">娣诲姞鍑哄簱鍗?/a>
        </div>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>鍑哄簱鍗曞彿</th>
                    <th>瀹㈡埛</th>
                    <th>鎿嶄綔鍛?/th>
                    <th>鎬婚噾棰?/th>
                    <th>鐘舵€?/th>
                    <th>鍒涘缓鏃堕棿</th>
                    <th>鎿嶄綔</th>
                </tr>
            </thead>
            <tbody>
                {foreach $outbounds as $outbound}
                <tr>
                    <td>{$outbound.id}</td>
                    <td>{$outbound.order_no}</td>
                    <td>{$outbound.customer}</td>
                    <td>{$outbound.operator}</td>
                    <td>{$outbound.total_amount}</td>
                    <td>{$outbound.status ? '宸插嚭搴? : '寰呭嚭搴?}</td>
                    <td>{$outbound.created_at}</td>
                    <td>
                        <a href="/outbound/edit/{$outbound.id}" class="btn btn-sm btn-primary">缂栬緫</a>
                        <a href="/outbound/delete/{$outbound.id}" class="btn btn-sm btn-danger">鍒犻櫎</a>
                    </td>
                </tr>
                {/foreach}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缂栬緫鐢ㄦ埛 - 浠撳偍绠＄悊绯荤粺</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>缂栬緫鐢ㄦ埛</h1>
        <form action="/user/edit/{$user.id}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">鐢ㄦ埛鍚?/label>
                <input type="text" class="form-control" id="username" name="username" value="{$user.username}" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">瀵嗙爜锛堢暀绌轰笉淇敼锛?/label>
                <input type="password" class="form-control" id="password" name="password">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">閭</label>
                <input type="email" class="form-control" id="email" name="email" value="{$user.email}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">鎵嬫満鍙?/label>
                <input type="tel" class="form-control" id="phone" name="phone" value="{$user.phone}" required>
            </div>
            <div class="mb-3">
                <label for="role" class="form-label">瑙掕壊</label>
                <select class="form-control" id="role" name="role" required>
                    <option value="user" {if $user.role == 'user'}selected{/if}>鏅€氱敤鎴?/option>
                    <option value="admin" {if $user.role == 'admin'}selected{/if}>绠＄悊鍛?/option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary">淇濆瓨</button>
            <a href="/user/index" class="btn btn-secondary">鍙栨秷</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瑙掕壊绠＄悊 - 浠撳偍绠＄悊绯荤粺</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>瑙掕壊绠＄悊</h1>
        <div class="mt-3 mb-3">
            <a href="/role/add" class="btn btn-primary">娣诲姞瑙掕壊</a>
        </div>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>瑙掕壊鍚嶇О</th>
                    <th>鎻忚堪</th>
                    <th>鍒涘缓鏃堕棿</th>
                    <th>鎿嶄綔</th>
                </tr>
            </thead>
            <tbody>
                {foreach $roles as $role}
                <tr>
                    <td>{$role.id}</td>
                    <td>{$role.name}</td>
                    <td>{$role.description}</td>
                    <td>{$role.created_at}</td>
                    <td>
                        <a href="/role/edit/{$role.id}" class="btn btn-sm btn-primary">缂栬緫</a>
                        <a href="/role/assign/{$role.id}" class="btn btn-sm btn-secondary">鍒嗛厤鏉冮檺</a>
                        <a href="/role/delete/{$role.id}" class="btn btn-sm btn-danger" onclick="return confirm('纭畾瑕佸垹闄ゅ悧锛?);">鍒犻櫎</a>
                    </td>
                </tr>
                {/foreach}
            </tbody>
        </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

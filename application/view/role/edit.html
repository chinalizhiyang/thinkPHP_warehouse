<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>缂栬緫瑙掕壊 - 浠撳偍绠＄悊绯荤粺</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>缂栬緫瑙掕壊</h1>
        <form action="/role/edit/{$role.id}" method="post">
            <div class="mb-3">
                <label for="name" class="form-label">瑙掕壊鍚嶇О</label>
                <input type="text" class="form-control" id="name" name="name" value="{$role.name}" required>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label">鎻忚堪</label>
                <textarea class="form-control" id="description" name="description" rows="3">{$role.description}</textarea>
            </div>
            <button type="submit" class="btn btn-primary">淇濆瓨</button>
            <a href="/role" class="btn btn-secondary">鍙栨秷</a>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
